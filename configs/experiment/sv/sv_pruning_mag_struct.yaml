# @package _global_

# Structured (ln_structured) gradual magnitude pruning of the WeSpeaker ECAPA-TDNN.
# Canonical magnitude-pruning parent: the unstruct and *_onetime variants inherit
# these gates, scheduler and augmentation and override only the pruning knobs.
# Run: python src/train.py experiment=sv/sv_pruning_mag_struct

defaults:
  - _self_
  - /module/sv_model: wespeaker_ecapa_tdnn.yaml
  - /module/scoring: as_norm
  - /module/augmentation: wespeaker # default augmentation; null in body to disable
  - override /callbacks:
      - default.yaml
      - checkpoint_handler.yaml
  - override /datamodule: datasets/cnceleb.yaml
  - override /module: sv.yaml
  - override /trainer: gpu.yaml
  - override /logger: tensorboard.yaml

tags:
  [
    '${oc.eval:''"${datamodule.dataset.data_dir}".split("/")[-1]''}',
    "sv",
    "pruning",
    "ln_structured",
    "gradual",
  ]
seed: 42

_pruning_tolerance: 0.01 # convergence band shared by the gates: in-band iff |sparsity - target| <= this

trainer:
  max_epochs: 50
  min_epochs: ${oc.eval:'int(${trainer.max_epochs} * 0.2)'}
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0

callbacks:
  model_checkpoint:
    _target_: src.callbacks.pruning.sparsity_gating.SparsityGatedModelCheckpoint
    target_sparsity: ${callbacks.model_pruning.amount} # band centre = pruning rate; top-k saved only within tolerance of this
    tolerance: ${_pruning_tolerance} # in-band half-width: |sparsity - target| <= tolerance
    sparsity_metric: "pruning/sparsity" # gate signal: pruned groups only (the pruning rate); `sparsity` would be overall whole-model
    mode: max
    monitor: ${replace:"valid/__metric__"}
    save_top_k: 5
    every_n_epochs: 1
  checkpoint_averaging:
    _target_: src.callbacks.checkpoint_averaging.CheckpointAveraging
    num_checkpoints: ${callbacks.model_checkpoint.save_top_k}
    output_filename: averaged_top{num}.ckpt
  model_pruning:
    _target_: src.callbacks.pruning.prune.MagnitudePruner
    pruning_fn: ln_structured # torch.nn.utils.prune fn: ln_structured, l1_unstructured, random_structured, random_unstructured
    amount: 0.9 # final sparsity once scheduled_pruning finishes ramping
    use_global_unstructured: false # per-layer structured pruning, not a single global ranking
    make_pruning_permanent: true # fuse masks into weights at training end
    pruning_dim: 1 # dimension pruned by ln_structured
    pruning_norm: 1 # Ln norm used to rank structures (L1)
    verbose: 1
    scheduled_pruning: true # ramp sparsity to `amount` over `epochs_to_ramp`
    epochs_to_ramp: 10 # epochs over which the pruning rate ramps to `amount`
    schedule_type: constant # constant pruning RATE (log-space interpolation), not a linear sparsity ramp
    tolerance: ${_pruning_tolerance} # monotonicity check band, shared with the gates
  early_stopping:
    _target_: src.callbacks.pruning.sparsity_gating.SparsityGatedEarlyStopping
    target_sparsity: ${callbacks.model_pruning.amount} # patience advances only while in-band around this
    tolerance: ${_pruning_tolerance} # shared in-band half-width
    sparsity_metric: "pruning/sparsity" # gate signal (see model_checkpoint)
    check_on_train_epoch_end: false # check at validation end, so suppressed epochs never accrue patience
    mode: max
    monitor: ${replace:"valid/__metric__"}
    patience: ${oc.eval:'int(${trainer.max_epochs} * 0.5)'}
  ramp_validation_gate:
    _target_: src.callbacks.pruning.sparsity_gating.RampValidationGate
    target_sparsity: ${callbacks.model_pruning.amount} # validation runs only within tolerance of this
    tolerance: ${_pruning_tolerance} # shared in-band half-width
    sparsity_metric: "pruning/sparsity" # gate signal (see model_checkpoint)

datamodule:
  dataset:
    segment_duration: 3.0
    max_duration: 3.0
    use_pre_segmentation: true

  num_classes: ${oc.eval:'(${oc.select:module.data_augmentation.augmentations.wav_augmenter.speed_perturb.virtual_speakers,False}) and (${datamodule._base_num_classes} * len(${oc.select:module.data_augmentation.augmentations.wav_augmenter.speed_perturb.speed_factors,[]})) or ${datamodule._base_num_classes}'}

  loaders:
    train:
      batch_size: 128
    valid:
      batch_size: 128
    test:
      batch_size: 8
    enrollment:
      batch_size: 8

module:
  criterion:
    aam:
      _target_: speechbrain.nnet.losses.LogSoftmaxWrapper
      loss_fn:
        _target_: speechbrain.nnet.losses.AdditiveAngularMargin
        margin: 0.2
        scale: 32.0

  # WeSpeaker-style LR schedule: warmup + exponential decay (auto-scaled)
  lr_scheduler:
    scheduler:
      _target_: src.utils.schedulers.WarmupExponentialLR
      warmup_epochs: ${oc.eval:'max(1, int(${trainer.max_epochs} * 0.04))'}
      warmup_start_factor: ${oc.eval:'0.0 if "${..extras.interval}" == "step" else 1.0 / (max(1, int(${trainer.max_epochs} * 0.04)) + 1)'}
      gamma: ${oc.eval:'pow(0.0005, 1.0 / (${trainer.max_epochs} - max(1, int(${trainer.max_epochs} * 0.04))))'}
    extras:
      interval: "step"
      frequency: 1

  optimizer:
    _target_: torch.optim.SGD
    _partial_: True
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 1.0e-4

logger:
  wandb:
    tags: ${tags}
    group: ${oc.eval:"'${datamodule.dataset.data_dir}'.split('/')[-1]"}
