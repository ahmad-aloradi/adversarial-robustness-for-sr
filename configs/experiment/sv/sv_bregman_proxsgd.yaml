# @package _global_

# ProxSGD: minimize loss + lambda*||theta||_1 (penalty method, dense start).
# Inherits the AdaBreg parent; swaps the optimizer, starts dense
# (_bregman_initial_sparsity 0.0) and runs without augmentation.
# Run: python src/train.py experiment=sv/sv_bregman_proxsgd

defaults:
  - /experiment/sv/sv_bregman_adabreg
  - _self_

tags:
  [
    '${oc.eval:''"${datamodule.dataset.data_dir}".split("/")[-1]''}',
    "Bregman_learning",
    "sv",
    "ProxSGD",
  ]

_bregman_initial_sparsity: 0.0 # ProxSGD grows sparsity from a dense start
_bregman_lambda: ${bregman_lambda:ProxSGD,${_bregman_target_sparsity},initial_lambda}

callbacks:
  model_pruning:
    lambda_scheduler:
      cap_beta0: 10 # |Δλ| <= β_k·lr per update; ≈ ProxSGD λ-scale 0.1 / base lr 1e-2

module:
  optimizer:
    _target_: src.callbacks.pruning.bregman.bregman_optimizers.ProxSGD
    _partial_: True
    lr: 1e-2

  data_augmentation: null # ProxSGD baseline runs without augmentation
