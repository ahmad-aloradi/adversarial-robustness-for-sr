# @package _global_

# Adaptive-lambda AdaBreg pruning of the WeSpeaker ECAPA-TDNN.
# Canonical Bregman parent: linbreg / adabregw / proxsgd / *_fixed inherit
# these pruning_groups, gates, scheduler and augmentation; each swaps only the
# optimizer and its lambda source.
# Run: python src/train.py experiment=sv/sv_bregman_adabreg

defaults:
  - _self_
  - /module/sv_model: wespeaker_ecapa_tdnn.yaml
  - /module/scoring: as_norm
  - /module/augmentation: wespeaker # default augmentation; null in body to disable
  - override /callbacks: default.yaml
  - override /datamodule: datasets/cnceleb.yaml
  - override /module: sv.yaml
  - override /trainer: gpu.yaml
  - override /logger: tensorboard.yaml

tags:
  [
    '${oc.eval:''"${datamodule.dataset.data_dir}".split("/")[-1]''}',
    "Bregman_learning",
    "sv",
    "Adabreg",
  ]
seed: 42

# Single source of truth for Bregman sparsity targets and lambda values.
_bregman_target_sparsity: 0.9 # target sparsity the feedback loop drives toward
_bregman_tolerance: 0.01 # convergence band shared by the gates + scheduler: in-band iff |sparsity - target| <= this
_bregman_initial_sparsity: 0.99 # initial weight sparsity applied at setup
_bregman_sparsity_metric: bregman/pruned_sparsity # gate signal: the metric lambda steers on (regularized groups); `sparsity` is whole-model
_bregman_lambda: ${bregman_lambda:AdaBreg,${_bregman_target_sparsity},initial_lambda}

trainer:
  max_epochs: 40
  min_epochs: ${oc.eval:'int(${trainer.max_epochs} * 0.8)'}
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0

callbacks:
  model_checkpoint:
    _target_: src.callbacks.pruning.sparsity_gating.SparsityGatedModelCheckpoint
    target_sparsity: ${_bregman_target_sparsity} # band centre; top-k saved only within tolerance of this
    tolerance: ${_bregman_tolerance} # in-band half-width: |sparsity - target| <= tolerance
    sparsity_metric: ${_bregman_sparsity_metric}
    mode: max
    monitor: ${replace:"valid/__metric__"}
    save_top_k: 5
    every_n_epochs: 1
  checkpoint_averaging:
    _target_: src.callbacks.checkpoint_averaging.CheckpointAveraging
    num_checkpoints: ${callbacks.model_checkpoint.save_top_k}
    output_filename: averaged_top{num}.ckpt
  model_pruning:
    _target_: src.callbacks.pruning.bregman.bregman_pruner.BregmanPruner
    sparsity_threshold: 1e-12
    verbose: 2
    target_sparsity: ${_bregman_target_sparsity}
    lambda_scheduler:
      _target_: src.callbacks.pruning.bregman.lambda_scheduler.LambdaScheduler
      _partial_: true
      initial_lambda: ${_bregman_lambda}
      acceleration_factor: 1.0
      update_frequency: 50
  early_stopping:
    _target_: src.callbacks.pruning.sparsity_gating.SparsityGatedEarlyStopping
    target_sparsity: ${_bregman_target_sparsity} # patience advances only while in-band around this
    tolerance: ${_bregman_tolerance} # shared in-band half-width
    sparsity_metric: ${_bregman_sparsity_metric}
    check_on_train_epoch_end: false # check at validation end, so suppressed epochs never accrue patience
    mode: max
    monitor: ${replace:"valid/__metric__"}
    patience: ${oc.eval:'int(${trainer.max_epochs} * 0.5)'}
  ramp_validation_gate:
    _target_: src.callbacks.pruning.sparsity_gating.RampValidationGate
    target_sparsity: ${_bregman_target_sparsity} # validation runs only within tolerance of this
    tolerance: ${_bregman_tolerance} # shared in-band half-width
    sparsity_metric: ${_bregman_sparsity_metric}

datamodule:
  dataset:
    segment_duration: 3.0
    max_duration: 3.0
    use_pre_segmentation: True

  # Auto-scale only when virtual speakers are enabled
  num_classes: ${oc.eval:'(${oc.select:module.data_augmentation.augmentations.wav_augmenter.speed_perturb.virtual_speakers,False}) and (${datamodule._base_num_classes} * len(${oc.select:module.data_augmentation.augmentations.wav_augmenter.speed_perturb.speed_factors,[]})) or ${datamodule._base_num_classes}'}

  loaders:
    train:
      batch_size: 128
    valid:
      batch_size: 128
    test:
      batch_size: 8
    enrollment:
      batch_size: 8

module:
  criterion:
    aam:
      _target_: speechbrain.nnet.losses.LogSoftmaxWrapper
      loss_fn:
        _target_: speechbrain.nnet.losses.AdditiveAngularMargin
        margin: 0.2
        scale: 32.0

  # WeSpeaker-style LR schedule: warmup + exponential decay (auto-scaled)
  lr_scheduler:
    scheduler:
      _target_: src.utils.schedulers.WarmupExponentialLR
      warmup_epochs: ${oc.eval:'max(1, int(${trainer.max_epochs} * 0.04))'}
      warmup_start_factor: ${oc.eval:'0.0 if "${..extras.interval}" == "step" else 1.0 / (max(1, int(${trainer.max_epochs} * 0.04)) + 1)'}
      gamma: ${oc.eval:'pow(0.0005, 1.0 / (${trainer.max_epochs} - max(1, int(${trainer.max_epochs} * 0.04))))'}
    extras:
      interval: "step"
      frequency: 1

  optimizer:
    _target_: src.callbacks.pruning.bregman.bregman_optimizers.AdaBreg
    _partial_: true
    lr: 1e-2

  model:
    pruning_groups:
      # Group 1: Prunable Convolutional Layers
      - name: conv_layers
        layer_types: ["torch.nn.Conv1d", "torch.nn.Conv2d"]
        param_names: ["weight"]
        module_name_patterns:
          - ".*conv.*"
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegL1
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"
          sparsity_rate: ${_bregman_initial_sparsity} # initial weight sparsity

      # Group 2a: Prunable Linear Layers (any torch.nn.Linear regardless of name)
      - name: linear_layers
        layer_types: ["torch.nn.Linear"]
        param_names: ["weight"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegL1
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"
          sparsity_rate: ${_bregman_initial_sparsity} # initial weight sparsity

      # Group 2b: Classifier head (bias falls through to bias_params)
      - name: classifier
        layer_types: ["speechbrain.lobes.models.ECAPA_TDNN.Classifier"]
        param_names: ["weight"]
        module_name_patterns:
          - ".*classifier.*"
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegL1
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"
          sparsity_rate: ${_bregman_initial_sparsity} # initial weight sparsity

      # Group 3: Norm layers — never pruned
      - name: norm_params
        layer_types:
          [
            "torch.nn.BatchNorm1d",
            "torch.nn.BatchNorm2d",
            "torch.nn.LayerNorm",
            "torch.nn.GroupNorm",
          ]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0

      # Group 4: Biases (any layer type) — never pruned
      - name: bias_params
        param_names: ["bias"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
            lamda: ${_bregman_lambda}
          lambda_scale: 0.0

      # Group 5: Fallback — catches what's left over (MUST BE LAST)
      - name: fallback
        is_fallback: True
        module_name_patterns: [".*"]
        param_names: ["weight"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegL1
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"
          sparsity_rate: ${_bregman_initial_sparsity} # initial weight sparsity

logger:
  wandb:
    tags: ${tags}
    group: ${oc.eval:"'${datamodule.dataset.data_dir}'.split('/')[-1]"}
