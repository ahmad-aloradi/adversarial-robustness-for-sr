# @package _global_

# AdaBreg with decoupled weight decay (AdamW-style): weight decay is applied
# after the proximal step, independent of the subgradient accumulation.
# Inherits the AdaBreg parent; swaps only the optimizer.
# Run: python src/train.py experiment=sv/sv_bregman_adabregw

defaults:
  - /experiment/sv/sv_bregman_adabreg
  - _self_

tags:
  [
    '${oc.eval:''"${datamodule.dataset.data_dir}".split("/")[-1]''}',
    "Bregman_learning",
    "sv",
    "AdabregW",
  ]

_bregman_lambda: ${bregman_lambda:AdaBregW,${_bregman_target_sparsity},initial_lambda}

module:
  optimizer:
    _target_: src.callbacks.pruning.bregman.bregman_optimizers.AdaBregW
    _partial_: true
    lr: 1e-2
    weight_decay: 1e-2
