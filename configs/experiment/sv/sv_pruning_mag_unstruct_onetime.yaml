# @package _global_

# One-shot global unstructured pruning: prune to `amount` at the first epoch,
# then fine-tune (no ramp). Inherits the gradual unstructured variant; the
# sparsity gates sit at the target from epoch 0, so they never suppress.
# Run: python src/train.py experiment=sv/sv_pruning_mag_unstruct_onetime

defaults:
  - /experiment/sv/sv_pruning_mag_unstruct
  - _self_

tags:
  [
    '${oc.eval:''"${datamodule.dataset.data_dir}".split("/")[-1]''}',
    "sv",
    "pruning",
    "l1_unstructured",
    "onetime",
  ]

callbacks:
  model_pruning:
    scheduled_pruning: false # prune once to `amount`, no ramp
    epochs_to_ramp: null # required to be unset when scheduled_pruning is false
