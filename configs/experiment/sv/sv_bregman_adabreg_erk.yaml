# @package _global_
# AdaBreg with a layerwise ERK/ER sparsity distribution (RigL arXiv:1911.11134).
#
# Each prunable Conv/Linear weight is expanded into its own optimizer param
# group with its own RegL1, its own ERK-derived INITIAL sparsity, and its own
# LambdaScheduler that holds that layer's ERK TARGET for the whole run (RigL
# keeps per-layer sparsity fixed). PruningManager does the expansion at
# optimizer-construction time; BregmanPruner clones the scheduler template
# below once per layer.
#
# IMPORTANT: `_bregman_target_sparsity` here is the target over the PRUNABLE
# weight set (Conv/Linear/Classifier weights), NOT whole-model sparsity. BN,
# norm, and bias params stay dense, so the reported overall-model sparsity is
# slightly lower. The per-layer targets sum to the global target by
# construction of the ERK budget-solve; reaching them still depends on each
# per-layer controller. Validation is gated on the pruned (not overall)
# sparsity.
#
# `_erk_mode`: "erk" includes kernel size (larger-kernel layers get higher
# sparsity); "er" ignores it (kernel-free, equivalent for Linear-only models).

defaults:
  - sv/sv_bregman_adabreg
  - _self_

_bregman_target_sparsity: 0.904 # PRUNABLE-weight target (not overall-model)
_erk_mode: erk # er | erk

module:
  model:
    # Replaces the coarse conv_layers/linear_layers/classifier groups with one
    # auto-expanding ERK group. norm/bias stay dense (RegNone); the fallback is
    # RegNone too so no regularized group is left without an ERK target.
    pruning_groups:
      - name: erk_prunable
        layer_types:
          [
            "torch.nn.Conv1d",
            "torch.nn.Conv2d",
            "torch.nn.Linear",
            "speechbrain.lobes.models.ECAPA_TDNN.Classifier",
          ]
        param_names: ["weight"]
        auto_per_layer_erk:
          mode: ${_erk_mode}
          target_sparsity: ${_bregman_target_sparsity}
          # null => each layer starts AT its ERK target (RigL-faithful). Set a
          # denser value (e.g. 0.99) to start sparser and let lambda ramp in.
          initial_target_sparsity: null
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegL1
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"

      - name: norm_params
        layer_types:
          [
            "torch.nn.BatchNorm1d",
            "torch.nn.BatchNorm2d",
            "torch.nn.LayerNorm",
            "torch.nn.GroupNorm",
          ]
        module_name_patterns:
          [".*gn.*", ".*ln.*", ".*bn.*", ".*norm.*", ".*pos_enc.*", ".*head.*"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0

      - name: bias_params
        param_names: ["bias"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0

      # Fallback is RegNone in ERK mode: any leftover weight stays dense rather
      # than being regularized without a per-layer scheduler.
      - name: fallback
        is_fallback: True
        module_name_patterns: [".*"]
        param_names: ["weight"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0
