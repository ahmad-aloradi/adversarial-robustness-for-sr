# @package _global_
# AdaBreg with a layerwise ERK/ER sparsity distribution (RigL arXiv:1911.11134).
#
# Each prunable Conv/Linear weight becomes its own optimizer group with its own
# RegL1 and LambdaScheduler. Training starts dense and each layer ramps its
# target to its ERK sparsity over _bregman_ramp_epochs, then holds.
#
# `_bregman_target_sparsity` is over the PRUNABLE weight set (Conv/Linear/
# Classifier weights), not whole-model; norm/bias stay dense. Validation is
# gated on the pruned sparsity.
#
# `_erk_mode`: "erk" factors in kernel size, "er" ignores it.

defaults:
  - sv/sv_bregman_adabreg
  - _self_

_erk_mode: erk # er | erk
_bregman_target_sparsity: 0.99 # PRUNABLE-weight target (not overall-model)
_bregman_lambda: 1e-3
_bregman_target_initial: 0.0  # set to null for the matching target
_bregman_ramp_epochs: 10

module:
  model:
    # Replaces the coarse conv_layers/linear_layers/classifier groups with one
    # auto-expanding ERK group. norm/bias stay dense (RegNone); the fallback is
    # RegNone too so no regularized group is left without an ERK target.
    pruning_groups:
      - name: erk_prunable
        layer_types:
          [
            "torch.nn.Conv1d",
            "torch.nn.Conv2d",
            "torch.nn.Linear",
            "speechbrain.lobes.models.ECAPA_TDNN.Classifier",
          ]
        param_names: ["weight"]
        auto_per_layer_erk:
          mode: ${_erk_mode}
          target_sparsity: ${_bregman_target_sparsity}
          # 0.0 => start dense (every weight non-zero) and let the per-layer
          # target ramp the mask in. Tied to _bregman_target_initial so the
          # initial mask and the ramp start agree at epoch 0; set both to null
          # to start AT the ERK target instead (RigL-faithful, no ramp).
          initial_target_sparsity: ${_bregman_target_initial}
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegL1
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"

      - name: norm_params
        layer_types:
          [
            "torch.nn.BatchNorm1d",
            "torch.nn.BatchNorm2d",
            "torch.nn.LayerNorm",
            "torch.nn.GroupNorm",
          ]
        module_name_patterns:
          [".*gn.*", ".*ln.*", ".*bn.*", ".*norm.*", ".*pos_enc.*", ".*head.*"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0

      - name: bias_params
        param_names: ["bias"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0

      # Fallback is RegNone in ERK mode: any leftover weight stays dense rather
      # than being regularized without a per-layer scheduler.
      - name: fallback
        is_fallback: True
        module_name_patterns: [".*"]
        param_names: ["weight"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0
