# @package _global_

# Fixed-lambda LinBreg: no lambda scheduler, static regularization.
# Lambda is still set via _bregman_lambda from the base config.

defaults:
  - sv/sv_bregman_linbreg
  - _self_

_bregman_fixed_lambda: ${bregman_lambda:LinBreg,${_bregman_target_sparsity},fixed_lambda}
_bregman_lambda: ${_bregman_fixed_lambda}

callbacks:
  model_pruning:
    lambda_scheduler: null
  # Fixed lambda has no ramp, so don't gate validation on sparsity: tolerance
  # 1.0 spans all sparsities -> gates never suppress (ramp variants keep 0.01).
  model_checkpoint:
    tolerance: 1.0
  early_stopping:
    tolerance: 1.0
  ramp_validation_gate:
    tolerance: 1.0
