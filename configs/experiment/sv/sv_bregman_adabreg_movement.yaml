# @package _global_
# AdaBreg + per-weight movement reweighting (reweighted-l1). Identical to
# sv_bregman_adabreg except the optimizer gives each weight its own
# soft-threshold lamda*a_i, redistributing a fixed sparsity budget toward the
# task-useful weights. Inherits _bregman_target_sparsity from the base so the
# A/B is matched -- override it on both runs (e.g. _bregman_target_sparsity=0.99)
# to compare at a fixed rate.
# Run: python train.py experiment=sv/sv_bregman_adabreg_movement

defaults:
  - sv/sv_bregman_adabreg # inherit parent
  - _self_

module:
  optimizer:
    _target_: src.callbacks.pruning.bregman.bregman_optimizers.AdaBreg
    _partial_: true
    lr: 1e-2 # matched to the baseline for a clean A/B
    movement_reweight: true
    # movement_signed: de-protects weights already being pushed to zero.
    # taylor_abs: always-positive |grad*p| saliency alternative.
    move_importance: taylor_abs
    move_clip: [0.01, 100.0] # per-weight threshold multiplier bounds
    # ~one epoch so the importance EMA populates before reweighting begins
    # (steps_per_epoch = train_segments / train.batch_size; ~10000 here).
    move_warmup_steps: 10000
