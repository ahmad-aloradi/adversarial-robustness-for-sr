# @package _global_

# Fixed-lambda AdaBreg: no lambda scheduler, static regularization.
# Lambda is still set via _bregman_lambda from the base config.
# Run: python src/train.py experiment=sv/sv_bregman_adabreg_fixed

defaults:
  - /experiment/sv/sv_bregman_adabreg
  - _self_

_bregman_fixed_lambda: ${bregman_lambda:AdaBreg,${_bregman_target_sparsity},fixed_lambda}
_bregman_lambda: ${_bregman_fixed_lambda}

callbacks:
  model_pruning:
    lambda_scheduler: null
  # Sparsity is whatever the static lambda reaches, so don't gate on it:
  # tolerance 1.0 spans all sparsities -> the gates never suppress.
  model_checkpoint:
    tolerance: 1.0
  early_stopping:
    tolerance: 1.0
  ramp_validation_gate:
    tolerance: 1.0
