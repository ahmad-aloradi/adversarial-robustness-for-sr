# @package _global_
# Progressive LinBreg: start dense (0% sparse) and ramp the TARGET sparsity up
# to 99% over 10 epochs in log-space, then hold. The lambda scheduler's
# feedback loop drives lambda smoothly per step to track the moving target, so
# there are no lambda jumps at epoch boundaries; validation stays suppressed
# until the final 99% sparsity is reached.
#
# `_bregman_target_sparsity` is the scalar final target (feeds the
# `bregman_lambda` resolver and is the ramp endpoint). `_bregman_target_initial`
# is both the ramp start and the initial weight sparsity (`sparsity_rate`), so
# the model genuinely begins dense.

defaults:
  - sv/sv_bregman_linbreg
  - _self_

_bregman_target_sparsity: 0.99 # final target (feeds resolver + scheduler)
_bregman_target_initial: 0.0 # ramp start AND initial weight sparsity
_bregman_ramp_epochs: 10
_bregman_schedule_type: constant # log-space ("exponential") ramp
_bregman_ramp_granularity: step # smooth per-step target
_bregman_initial_sparsity: ${_bregman_target_initial} # auto-matches sparsity_rate
_bregman_lambda: 1e-5
