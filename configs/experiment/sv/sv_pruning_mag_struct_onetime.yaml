# @package _global_

# One-shot structured pruning: prune to `amount` at the first epoch, then
# fine-tune (no ramp). Inherits the gradual structured parent; the sparsity
# gates sit at the target from epoch 0, so they never suppress.
# Run: python src/train.py experiment=sv/sv_pruning_mag_struct_onetime

defaults:
  - /experiment/sv/sv_pruning_mag_struct
  - _self_

tags:
  [
    '${oc.eval:''"${datamodule.dataset.data_dir}".split("/")[-1]''}',
    "sv",
    "pruning",
    "ln_structured",
    "onetime",
  ]

callbacks:
  model_pruning:
    scheduled_pruning: false # prune once to `amount`, no ramp
    epochs_to_ramp: null # required to be unset when scheduled_pruning is false
