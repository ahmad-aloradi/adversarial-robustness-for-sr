# @package _global_
# LinBreg with a Bernoulli w_p explore->commit anneal. Mirrors
# sv_bregman_adabreg_wpanneal with the LinBreg optimizer. Fixed-target mode
# (inherited from sv_bregman_linbreg): the lambda scheduler holds the final 99%
# target and the base's _bregman_initial_sparsity (0.99) applies a random 99%
# mask at setup, so the model begins SPARSE, not dense. Validation stays
# suppressed until measured sparsity reaches target.
#
# The primal readout is a per-element Bernoulli gate: each step, every weight
# takes its standard Bregman prox step with probability w_p, or is frozen at its
# current value (a zero stays zero) with probability 1 - w_p. While w_p is held
# at w_p_init=1.0 (the first start_fraction=25% of the run) the readout is exact
# standard Bregman, so the initial random support migrates freely and overshoots
# self-heal. As w_p anneals 1->w_p_final the support commits element by element;
# once it reaches w_p_final the mask is latched and non-oscillating. Shrinking
# start_fraction toward 0 would freeze the initial random mask early -- keep it
# > 0 while starting sparse.
#
# `_bregman_target_sparsity` is the scalar final target (feeds the
# `bregman_lambda` resolver and the scheduler).

defaults:
  - sv/sv_bregman_linbreg
  - _self_

_bregman_target_sparsity: 0.99 # final target (feeds resolver + scheduler)

# The reversible explore window (start_fraction, w_p_init=1.0) is what makes the
# 99%-sparse start safe; see the header note above.
callbacks:
  model_pruning:
    wp_annealer:
      _target_: src.callbacks.pruning.bregman.wp_scheduler.WpAnnealer
      w_p_init: 1.0
      w_p_final: 0.1
      start_fraction: 0.25
      end_fraction: 0.75
      schedule: cosine
