# @package _global_
# LinBreg with trainable per-layer sparsity allocation. Mirrors
# sv_bregman_adabreg_trainable_scales with the LinBreg optimizer.
#
# One global LambdaScheduler owns the sparsity LEVEL; each prunable layer's
# lambda_scale = e^{s_g} is an ordinary nn.Parameter trained by the same
# optimizer in a RegNone group. The global controller and validation gate
# measure OVERALL model sparsity.

defaults:
  - sv/sv_bregman_linbreg
  - _self_

_erk_mode: erk
_bregman_target_sparsity: 0.99
_bregman_lambda: 1e-5
_bregman_target_initial: 0.0
_bregman_ramp_epochs: 10

callbacks:
  margin_scheduler:
    start_epoch: ${oc.eval:'int(${_bregman_ramp_epochs}) + 1'}

module:
  model:
    pruning_groups:
      - name: trainable_prunable
        layer_types:
          [
            "torch.nn.Conv1d",
            "torch.nn.Conv2d",
            "torch.nn.Linear",
            "speechbrain.lobes.models.ECAPA_TDNN.Classifier",
          ]
        param_names: ["weight"]
        auto_per_layer_erk:
          mode: ${_erk_mode}
          target_sparsity: ${_bregman_target_sparsity}
          initial_target_sparsity: ${_bregman_target_initial}
          allocation: trainable
          init: ones
          scale_lr: 1e-3
          scale_decay: 1e-4
          scale_clamp: [0.25, 4.0]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegL1
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"

      - name: norm_params
        layer_types:
          [
            "torch.nn.BatchNorm1d",
            "torch.nn.BatchNorm2d",
            "torch.nn.LayerNorm",
            "torch.nn.GroupNorm",
          ]
        module_name_patterns:
          [".*gn.*", ".*ln.*", ".*bn.*", ".*norm.*", ".*pos_enc.*", ".*head.*"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0

      - name: bias_params
        param_names: ["bias"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0

      - name: fallback
        is_fallback: True
        module_name_patterns: [".*"]
        param_names: ["weight"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0
