# @package _global_
# LinBreg + trainable per-layer allocation (water-filling). Mirrors the AdaBreg
# variant: a global LambdaScheduler sets the sparsity LEVEL; a per-layer
# log-scale s_g (init 0 ⇒ c_g = exp(s_g) = 1) learns the ALLOCATION.
# Overall-model target. Pre-log-scale (c-valued) checkpoints do not resume.

defaults:
  - sv/sv_bregman_linbreg
  - _self_

_bregman_target_sparsity: 0.99
_bregman_lambda: 1e-5

module:
  model:
    # Trainable-scale group over all prunable weights + Classifier;
    # norm/bias/fallback stay dense (RegNone).
    pruning_groups:
      - name: trainable_prunable
        layer_types:
          [
            "torch.nn.Conv1d",
            "torch.nn.Conv2d",
            "torch.nn.Linear",
            "speechbrain.lobes.models.ECAPA_TDNN.Classifier",
          ]
        param_names: ["weight"]
        trainable_scales:
          scale_lr: ${module.optimizer.lr} # match the weight lr
          initial_sparsity: ${_bregman_initial_sparsity}
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegL1
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0 # synced to c_g = exp(s_g) each batch
        pruning_config:
          pruning_type: "unstructured"

      - name: norm_params
        layer_types:
          [
            "torch.nn.BatchNorm1d",
            "torch.nn.BatchNorm2d",
            "torch.nn.LayerNorm",
            "torch.nn.GroupNorm",
          ]
        module_name_patterns:
          [".*gn.*", ".*ln.*", ".*bn.*", ".*norm.*", ".*pos_enc.*", ".*head.*"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0

      - name: bias_params
        param_names: ["bias"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0

      - name: fallback
        is_fallback: True
        module_name_patterns: [".*"]
        param_names: ["weight"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
          lambda_scale: 0.0
