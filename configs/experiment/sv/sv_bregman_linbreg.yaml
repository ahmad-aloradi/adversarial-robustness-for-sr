# @package _global_

# Adaptive-lambda LinBreg: inherits the AdaBreg parent's pruning_groups, gates,
# scheduler and augmentation; swaps only the optimizer and the lambda source.
# Run: python src/train.py experiment=sv/sv_bregman_linbreg

defaults:
  - /experiment/sv/sv_bregman_adabreg
  - _self_

tags:
  [
    '${oc.eval:''"${datamodule.dataset.data_dir}".split("/")[-1]''}',
    "Bregman_learning",
    "sv",
    "Linbreg",
  ]

_bregman_lambda: ${bregman_lambda:LinBreg,${_bregman_target_sparsity},initial_lambda}

module:
  optimizer:
    _target_: src.callbacks.pruning.bregman.bregman_optimizers.LinBreg
    _partial_: True
    lr: 1e-1
    # Use momentum: 0.0 to reproduce the NeurIPS draft results
    momentum: 0.9
    nesterov: false
