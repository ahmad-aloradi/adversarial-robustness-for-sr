# @package _global_

# Fixed-lambda LinBreg: no scheduler, static regularization.
# Run: python src/train.py experiment=img/bregman_linbreg_fixed datamodule=datasets/mnist

defaults:
  - /experiment/img/bregman_linbreg
  - _self_

tags: ["img", "${datamodule.name}", "Bregman_learning", "Linbreg", "fixed"]

_bregman_fixed_lambda: ${bregman_lambda:LinBreg,${_bregman_target_sparsity},fixed_lambda}
_bregman_lambda_factor: 1 # scales _bregman_fixed_lambda; override for lambda sweeps
_bregman_lambda: ${oc.eval:'${_bregman_fixed_lambda} * ${_bregman_lambda_factor}'}

callbacks:
  model_pruning:
    lambda_scheduler: null
  # Set to 1.0 for no gating
  model_checkpoint:
    tolerance: 0.05
  early_stopping:
    tolerance: 0.05
  ramp_validation_gate:
    tolerance: 0.05
