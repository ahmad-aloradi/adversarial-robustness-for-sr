# @package _global_

# Global unstructured (l1_unstructured) gradual magnitude pruning of ResNet-18
# on CIFAR-10. Inherits the structured parent; swaps only the pruning function,
# global-ranking flag, and sparsity schedule.
# Run: python src/train.py experiment=img/cifar10_pruning_mag_unstruct

defaults:
  - /experiment/img/cifar10_pruning_mag_struct
  - _self_

tags: ["img", "cifar10", "pruning", "l1_unstructured", "gradual"]

callbacks:
  model_pruning:
    pruning_fn: l1_unstructured # single global L1 ranking, not per-layer structures
    use_global_unstructured: true # single global ranking across all prunable parameters
    pruning_dim: null # not applicable to unstructured pruning
    pruning_norm: null # not applicable to unstructured pruning
    schedule_type: linear # linear sparsity ramp from 0 to `amount`
