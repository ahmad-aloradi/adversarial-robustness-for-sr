# @package _global_

# MNIST — fixed-lambda LinBreg pruning of ResNet-18.
# Inherits cifar10_bregman_linbreg_fixed; swaps only the dataset + epoch budget.
# Run: python src/train.py experiment=img/mnist_bregman_linbreg_fixed

defaults:
  - /experiment/img/cifar10_bregman_linbreg_fixed
  - override /datamodule: datasets/mnist.yaml
  - _self_

tags: ["img", "mnist", "Bregman_learning", "Linbreg", "fixed"]

trainer:
  max_epochs: 50
