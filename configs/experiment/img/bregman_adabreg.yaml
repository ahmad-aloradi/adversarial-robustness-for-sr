# @package _global_

# Adaptive-lambda AdaBreg pruning of ResNet-18.
# Canonical Bregman parent: the adabreg_fixed / linbreg / linbreg_fixed
# variants inherit these pruning_groups. Dataset-agnostic — the epoch budget
# comes from the dataset config.
# Run: python src/train.py experiment=img/bregman_adabreg datamodule=datasets/cifar100
# (defaults to CIFAR-10 when no datamodule override is given)

defaults:
  - override /datamodule: datasets/cifar10.yaml
  - override /module: img.yaml
  - override /trainer: gpu.yaml
  - override /callbacks: default.yaml
  - override /logger: many_loggers.yaml
  - _self_

tags: ["img", "${datamodule.name}", "Bregman_learning", "Adabreg"]
seed: 42

# Single source of truth for Bregman sparsity targets and lambda values.
_bregman_target_sparsity: 0.9 # target sparsity the feedback loop drives toward
_bregman_tolerance: 0.005 # convergence band shared by the gates: in-band iff (1-this)*target <= sparsity <= (1+this)*target
_bregman_initial_sparsity: 0.99 # initial weight sparsity applied at setup
_bregman_sparsity_metric: bregman/pruned_sparsity # gate signal: the metric lambda steers on (regularized groups); `sparsity` is whole-model
_bregman_lambda: ${bregman_lambda:AdaBreg,${_bregman_target_sparsity},initial_lambda}
_bregman_regularizer: RegL1 # readout on the regularized groups; RegL1 soft-thresholds
_lr_constant_epochs: 0 # epochs to hold lr flat before the cosine leg; the progressive children set it to their ramp length

trainer:
  max_epochs: ${datamodule.max_epochs} # per-dataset budget from the dataset config
  min_epochs: ${oc.eval:'int(${trainer.max_epochs} * 0.8)'}
  gradient_clip_val: null
  num_sanity_val_steps: 0
  # AdaptiveAvgPool2d has no deterministic CUDA backward.
  deterministic: warn

callbacks:
  model_checkpoint:
    _target_: src.callbacks.pruning.sparsity_gating.SparsityGatedModelCheckpoint
    target_sparsity: ${_bregman_target_sparsity} # band centre; top-k saved only within tolerance of this
    tolerance: ${_bregman_tolerance} # in-band half-width, as a fraction of the target
    sparsity_metric: ${_bregman_sparsity_metric}
    mode: max
    monitor: ${replace:"valid/__metric__"}
    save_top_k: 1 # never >1: eval averages the top-k, and averaging masks refills pruned weights
    every_n_epochs: 1
  model_pruning:
    _target_: src.callbacks.pruning.bregman.bregman_pruner.BregmanPruner
    sparsity_threshold: 1e-12
    verbose: 2
    target_sparsity: ${_bregman_target_sparsity}
    lambda_scheduler:
      _target_: src.callbacks.pruning.bregman.lambda_scheduler.LambdaScheduler
      _partial_: true
      target_sparsity: ${_bregman_target_sparsity} # setpoint λ drives toward
      initial_sparsity: ${_bregman_initial_sparsity} # seeds the starting gap
      initial_lambda: ${_bregman_lambda}
      alpha_0: 1.0
      update_frequency: 50
  early_stopping:
    _target_: src.callbacks.pruning.sparsity_gating.SparsityGatedEarlyStopping
    target_sparsity: ${_bregman_target_sparsity} # patience advances only while in-band around this
    tolerance: ${_bregman_tolerance} # shared band half-width, as a fraction of the target
    sparsity_metric: ${_bregman_sparsity_metric}
    check_on_train_epoch_end: false # check at validation end, so suppressed epochs never accrue patience
    mode: max
    monitor: ${replace:"valid/__metric__"}
    patience: ${oc.eval:'int(${trainer.max_epochs} * 0.5)'}
  ramp_validation_gate:
    _target_: src.callbacks.pruning.sparsity_gating.RampValidationGate
    target_sparsity: ${_bregman_target_sparsity} # band centre
    tolerance: ${oc.eval:"${_bregman_tolerance} if '${datamodule.name}' == 'imagenet' else 1.0"} # 1.0 disables the gate; ImageNet keeps the band (docs/pruning.md §3)
    sparsity_metric: ${_bregman_sparsity_metric}

module:
  optimizer:
    _target_: src.callbacks.pruning.bregman.bregman_optimizers.AdaBreg
    _partial_: true
    lr: 1e-2
    weight_decay: 5e-4 # mu: dense_sgd's L2, inherited by every img Bregman arm

  lr_scheduler:
    scheduler:
      _target_: src.utils.lr_schedulers.constant_then_cosine
      constant_epochs: ${_lr_constant_epochs}
      max_epochs: ${trainer.max_epochs}

    extras:
      interval: epoch
      frequency: ${trainer.check_val_every_n_epoch}

  model:
    pruning_groups:
      # Prunable convolutions (stem conv1 + all block convs + downsample convs).
      - name: conv_layers
        layer_types:
          ["torch.nn.Conv2d", "torch.nn.ConvTranspose2d", "torch.nn.Conv1d"]
        param_names: ["weight"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.${_bregman_regularizer}
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"
          sparsity_rate: ${_bregman_initial_sparsity}

      # Prunable classifier head (fc).
      - name: linear_layers
        layer_types: ["torch.nn.Linear"]
        param_names: ["weight"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.${_bregman_regularizer}
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"
          sparsity_rate: ${_bregman_initial_sparsity}

      # BatchNorm weight+bias — never pruned (catches downsample BN too).
      - name: norm_params
        layer_types: ["torch.nn.BatchNorm2d", "torch.nn.BatchNorm1d"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
            lamda: ${_bregman_lambda}
          lambda_scale: 0.0

      # Biases from any remaining layer type — never pruned.
      - name: bias_params
        param_names: ["bias"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.RegNone
            lamda: ${_bregman_lambda}
          lambda_scale: 0.0

      # Catches anything left over (empty for resnet18). MUST BE LAST.
      - name: fallback
        is_fallback: True
        module_name_patterns: [".*"]
        param_names: ["weight"]
        optimizer_settings:
          reg:
            _target_: src.callbacks.pruning.bregman.bregman_regularizers.${_bregman_regularizer}
            lamda: ${_bregman_lambda}
          lambda_scale: 1.0
        pruning_config:
          pruning_type: "unstructured"
          sparsity_rate: ${_bregman_initial_sparsity}
