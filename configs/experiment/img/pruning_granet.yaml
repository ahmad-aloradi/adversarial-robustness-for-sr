# @package _global_

# GraNet (Liu et al., NeurIPS 2021): ramp from `initial_amount` to the target
# with a global cubic prune, keeping RigL-style regrowth running throughout.
# `initial_amount` picks the arm: 0.0 dense-to-sparse, 0.5 sparse-to-sparse.
# Constants from its CIFAR "starting from 50% sparse" command, not the paper
# text: --init-density 0.50 --final-density 0.10 --update-frequency 1000
# --prune-rate 0.5, --init-prune-epoch 0.
# Run: python src/train.py experiment=img/pruning_granet datamodule=datasets/mnist

defaults:
  - /experiment/img/pruning_rigl
  - _self_

tags: ["img", "${datamodule.name}", "sparse_training", "granet"]

_lr_constant_epochs: ${callbacks.model_pruning.final_prune_epoch} # hold lr flat through the prune+regrow ramp, cosine over what is left

callbacks:
  model_pruning:
    initial_amount: 0.5 # ramp start; GraNet Table 4's s_i
    final_prune_epoch: ${oc.eval:'int(${trainer.max_epochs} * 0.75)'} # 75% of the budget; GraNet's own ramp is 110/160 epochs
    update_frequency: 1000 # GraNet's --update-frequency, in optimizer steps
    drop_fraction: 0.5 # GraNet's --prune-rate
    drop_end_fraction: 1.0 # decay spans the whole run, so regrowth never stops
    drop_end_value: 0.005 # CosineDecay's eta_min: the floor the drop fraction holds
