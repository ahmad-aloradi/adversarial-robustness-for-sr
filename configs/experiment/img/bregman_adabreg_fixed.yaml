# @package _global_

# Fixed-lambda AdaBreg: no scheduler, static regularization.
# Run: python src/train.py experiment=img/bregman_adabreg_fixed datamodule=datasets/mnist

defaults:
  - /experiment/img/bregman_adabreg
  - _self_

tags: ["img", "${datamodule.name}", "Bregman_learning", "Adabreg", "fixed"]

_bregman_fixed_lambda: ${bregman_lambda:AdaBreg,${_bregman_target_sparsity},fixed_lambda}
_bregman_lambda: ${_bregman_fixed_lambda}

callbacks:
  model_pruning:
    lambda_scheduler: null
  # Sparsity is whatever the static lambda reaches, so don't gate on it: tolerance 1.0 spans all sparsities.
  model_checkpoint:
    tolerance: 1.0
  ramp_validation_gate:
    tolerance: 1.0
