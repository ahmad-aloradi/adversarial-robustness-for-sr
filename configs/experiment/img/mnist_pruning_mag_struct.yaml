# @package _global_

# MNIST — structured gradual magnitude pruning of ResNet-18.
# Inherits cifar10_pruning_mag_struct; swaps only the dataset + epoch budget.
# Run: python src/train.py experiment=img/mnist_pruning_mag_struct

defaults:
  - /experiment/img/cifar10_pruning_mag_struct
  - override /datamodule: datasets/mnist.yaml
  - _self_

tags: ["img", "mnist", "pruning", "ln_structured", "gradual"]

trainer:
  max_epochs: 50
