# @package _global_

# Global unstructured (l1_unstructured) gradual magnitude pruning of ResNet-18.
# Inherits the structured parent (incl. the cubic schedule); swaps the pruning
# function, the global-ranking flag and the ramp start.
# Run: python src/train.py experiment=img/pruning_mag_unstruct datamodule=datasets/mnist

defaults:
  - /experiment/img/pruning_mag_struct
  - _self_

tags: ["img", "${datamodule.name}", "pruning", "l1_unstructured", "gradual"]

callbacks:
  model_pruning:
    pruning_fn: l1_unstructured # single global L1 ranking, not per-layer structures
    use_global_unstructured: true # single global ranking across all prunable parameters
    prune_last_layer: true # element-wise pruning thins fc without dropping a class
    initial_amount: 0.0 # dense start
    pruning_dim: null # not applicable to unstructured pruning
    pruning_norm: null # not applicable to unstructured pruning
