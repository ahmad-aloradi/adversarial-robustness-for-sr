# @package _global_

# MNIST — adaptive LinBreg pruning of ResNet-18.
# Inherits cifar10_bregman_linbreg; swaps only the dataset + epoch budget.
# Run: python src/train.py experiment=img/mnist_bregman_linbreg

defaults:
  - /experiment/img/cifar10_bregman_linbreg
  - override /datamodule: datasets/mnist.yaml
  - _self_

tags: ["img", "mnist", "Bregman_learning", "Linbreg"]

trainer:
  max_epochs: 50
