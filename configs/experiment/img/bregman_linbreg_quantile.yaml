# @package _global_

# Quantile-threshold LinBreg: inherits the AdaBreg-quantile parent's
# ResNet-18 pruning_groups + quantile scheduler; swaps only the optimizer and
# the lambda source, exactly as bregman_linbreg.yaml swaps them on
# bregman_adabreg.yaml.
# Run: python src/train.py experiment=img/bregman_linbreg_quantile datamodule=datasets/cifar100

defaults:
  - /experiment/img/bregman_adabreg_quantile
  - _self_

tags: ["img", "${datamodule.name}", "Bregman_learning", "Linbreg", "quantile"]

_bregman_lambda: ${bregman_lambda:LinBreg,${_bregman_target_sparsity},initial_lambda}

module:
  optimizer:
    _target_: src.callbacks.pruning.bregman.bregman_optimizers.LinBreg
    _partial_: True
    lr: 5e-2
    momentum: 0.9
    nesterov: false
