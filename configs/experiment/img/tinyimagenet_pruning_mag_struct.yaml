# @package _global_

# TinyImageNet — structured gradual magnitude pruning of ResNet-18.
# Inherits cifar10_pruning_mag_struct; swaps only the dataset + epoch budget.
# Prep first: bash scripts/datasets/prep_tiny_imagenet.sh
# Run: python src/train.py experiment=img/tinyimagenet_pruning_mag_struct

defaults:
  - /experiment/img/cifar10_pruning_mag_struct
  - override /datamodule: datasets/tinyimagenet.yaml
  - _self_

tags: ["img", "tinyimagenet", "pruning", "ln_structured", "gradual"]

trainer:
  max_epochs: 100
