# @package _global_

# Adaptive-lambda LinBreg: inherits the AdaBreg parent's ResNet-18
# pruning_groups + callbacks; swaps only the optimizer and the lambda source.
# Run: python src/train.py experiment=img/cifar10_bregman_linbreg

defaults:
  - /experiment/img/cifar10_bregman_adabreg
  - _self_

tags: ["img", "cifar10", "Bregman_learning", "Linbreg"]

_bregman_lambda: ${bregman_lambda:LinBreg,${_bregman_target_sparsity},initial_lambda}

module:
  optimizer:
    _target_: src.callbacks.pruning.bregman.bregman_optimizers.LinBreg
    _partial_: True
    momentum: 0.0
    lr: 1e-1
