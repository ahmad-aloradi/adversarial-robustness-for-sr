# @package _global_

# Quantile LinBreg with a ramped target: same cubic ramp as
# bregman_linbreg_progressive, but lambda is the K-th order statistic of |v|
# each update instead of a feedback estimate.
# Run: python src/train.py experiment=img/bregman_linbreg_quantile_progressive datamodule=datasets/cifar100

defaults:
  - /experiment/img/bregman_linbreg_quantile
  - _self_

tags:
  [
    "img",
    "${datamodule.name}",
    "Bregman_learning",
    "Linbreg",
    "quantile",
    "progressive",
  ]

_bregman_initial_sparsity: 0.5 # ramp start: the sparsity the weights are initialized at
_bregman_ramp_epochs: ${_sparsity_ramp_epochs}
_bregman_schedule_type: cubic # Zhu & Gupta / GraNet Eq. 1 cubic ramp, as in pruning_mag_struct

callbacks:
  target_scheduler:
    _target_: src.callbacks.pruning.bregman.target_scheduler.TargetScheduler
    initial_sparsity: ${_bregman_initial_sparsity} # ramp start; the end is the controller's target
    epochs_to_ramp: ${_bregman_ramp_epochs}
    schedule_type: ${_bregman_schedule_type}
