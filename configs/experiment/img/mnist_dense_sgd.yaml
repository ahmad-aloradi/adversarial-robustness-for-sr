# @package _global_

# ResNet-18 dense SGD baseline on MNIST (~99.5% top-1).
# Run: python src/train.py experiment=img/mnist_dense_sgd

defaults:
  - /experiment/img/cifar10_dense_sgd
  - override /datamodule: datasets/mnist.yaml
  - _self_

tags: ["img", "mnist", "dense", "sgd"]

trainer:
  max_epochs: 30
