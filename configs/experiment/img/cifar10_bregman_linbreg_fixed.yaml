# @package _global_

# Fixed-lambda LinBreg: no scheduler, static regularization.
# Run: python src/train.py experiment=img/cifar10_bregman_linbreg_fixed

defaults:
  - /experiment/img/cifar10_bregman_linbreg
  - _self_

tags: ["img", "cifar10", "Bregman_learning", "Linbreg", "fixed"]

_bregman_fixed_lambda: ${bregman_lambda:LinBreg,${_bregman_target_sparsity},fixed_lambda}
_bregman_lambda: ${_bregman_fixed_lambda}

callbacks:
  model_pruning:
    lambda_scheduler: null
  # Fixed lambda has no ramp, so don't gate validation on sparsity.
  model_checkpoint:
    tolerance: 1.0
  early_stopping:
    tolerance: 1.0
  ramp_validation_gate:
    tolerance: 1.0
