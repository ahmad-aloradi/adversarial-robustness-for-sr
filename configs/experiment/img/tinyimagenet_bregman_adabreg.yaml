# @package _global_

# TinyImageNet — adaptive AdaBreg pruning of ResNet-18.
# Inherits cifar10_bregman_adabreg; swaps only the dataset + epoch budget.
# Prep first: bash scripts/datasets/prep_tiny_imagenet.sh
# Run: python src/train.py experiment=img/tinyimagenet_bregman_adabreg

defaults:
  - /experiment/img/cifar10_bregman_adabreg
  - override /datamodule: datasets/tinyimagenet.yaml
  - _self_

tags: ["img", "tinyimagenet", "Bregman_learning", "Adabreg"]

trainer:
  max_epochs: 100
