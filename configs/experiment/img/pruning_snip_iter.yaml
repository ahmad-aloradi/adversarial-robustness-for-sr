# @package _global_

# Iterative SNIP (de Jorge et al., ICLR 2021): SNIP's |w * grad| criterion spent
# over T prune steps, rescoring the masked network each time. A single ranking
# scores each weight ~1/layer_size on a BatchNorm net, so the largest layers
# starve; rescoring lets an over-pruned layer's gradients grow and stop it.
# Run: python src/train.py experiment=img/pruning_snip_iter datamodule=datasets/mnist

defaults:
  - /experiment/img/pruning_snip
  - _self_

tags: ["img", "${datamodule.name}", "sparse_training", "snip_iter"]

callbacks:
  model_pruning:
    snip_iterations: 100 # T: density walks (1 - amount)^(t/T) down to the target
