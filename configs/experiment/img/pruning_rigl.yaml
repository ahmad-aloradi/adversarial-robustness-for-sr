# @package _global_

# RigL (Evci et al., ICML 2020): sparse from step 0, mask redrawn every dT
# steps by dropping the smallest weights and regrowing the largest gradients.
# Canonical dynamic-sparse-training parent: set / static / snip / granet
# inherit it. Dataset-agnostic — the epoch budget comes from the dataset config.
# Run: python src/train.py experiment=img/pruning_rigl datamodule=datasets/cifar100
# (defaults to CIFAR-10 when no datamodule override is given)

defaults:
  - override /datamodule: datasets/cifar10.yaml
  - override /module: img.yaml
  - override /trainer: gpu.yaml
  - override /callbacks: default.yaml
  - override /logger: many_loggers.yaml
  - _self_

tags: ["img", "${datamodule.name}", "sparse_training", "rigl"]
seed: 42

_pruning_tolerance: 0.005 # convergence band shared by the gates: in-band iff (1-this)*target <= sparsity <= (1+this)*target
_sparsity_ramp_epochs: ${oc.eval:'int(${trainer.max_epochs} * 0.5)'} # every sparsity ramp reaches its target here, independent of the lr schedule

trainer:
  max_epochs: ${datamodule.max_epochs} # per-dataset budget from the dataset config
  min_epochs: ${oc.eval:'int(${trainer.max_epochs} * 0.8)'}
  gradient_clip_val: null # DST keeps the gradient dense for the growth criterion, so a clip on the dense norm shrinks the live weights' steps ~6x at 99% sparsity; upstream RigL does not clip
  num_sanity_val_steps: 0
  # AdaptiveAvgPool2d has no deterministic CUDA backward.
  deterministic: warn

callbacks:
  model_checkpoint:
    _target_: src.callbacks.pruning.sparsity_gating.SparsityGatedModelCheckpoint
    target_sparsity: ${callbacks.model_pruning.amount} # band centre = the mask's sparsity; top-k saved only within tolerance of this
    tolerance: ${_pruning_tolerance} # in-band half-width, as a fraction of the target
    sparsity_metric: "pruning/sparsity" # gate signal: all weight tensors, norms and biases aside; `sparsity` would be overall whole-model
    mode: max
    monitor: ${replace:"valid/__metric__"}
    save_top_k: 1 # never >1: eval averages the top-k, and averaging masks refills pruned weights
    every_n_epochs: 1
  model_pruning:
    _target_: src.callbacks.pruning.dst_pruner.DynamicSparsePruner
    amount: 0.95 # final sparsity over all weight tensors (norms and biases aside), held from step 0
    mask_init: erk # RigL's Erdos-Renyi-Kernel layerwise budget
    growth: gradient # regrow the largest dense gradients; `random` is SET
    update_frequency: 100 # RigL's delta-T, in optimizer steps
    prune_first_layer: true # ERK sparsifies every layer; RigL holds the stem dense only under its Uniform distribution
    drop_fraction: 0.3 # RigL's alpha: share of active weights redrawn at step 0
    drop_end_fraction: 0.75 # cosine reaches drop_end_value here, so updates stop
    tolerance: ${_pruning_tolerance} # drift band asserted at every epoch end
  ramp_validation_gate:
    _target_: src.callbacks.pruning.sparsity_gating.RampValidationGate
    target_sparsity: ${callbacks.model_pruning.amount} # band centre
    tolerance: ${oc.eval:"${_pruning_tolerance} if '${datamodule.name}' == 'imagenet' else 1.0"} # 1.0 disables the gate; ImageNet keeps the band (docs/pruning.md §3)
    sparsity_metric: "pruning/sparsity" # gate signal (see model_checkpoint)

module:
  optimizer:
    _target_: torch.optim.SGD
    _partial_: True
    lr: 0.1
    momentum: 0.9
    weight_decay: ${datamodule.weight_decay} # per-dataset; 1e-4 on ImageNet, 5e-4 elsewhere
    nesterov: false
  lr_scheduler:
    scheduler:
      _target_: src.utils.lr_schedulers.warmup_then_cosine
      warmup_epochs: ${oc.eval:'int(${trainer.max_epochs} * 0.1)'} # use 10% warmup
      max_epochs: ${trainer.max_epochs}
      start_factor: 0.1 # first-epoch lr = 0.1 x module.optimizer.lr
      eta_min: 1.0e-6
    extras:
      interval: epoch
      frequency: ${trainer.check_val_every_n_epoch}
