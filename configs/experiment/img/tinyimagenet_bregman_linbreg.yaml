# @package _global_

# TinyImageNet — adaptive LinBreg pruning of ResNet-18.
# Inherits cifar10_bregman_linbreg; swaps only the dataset + epoch budget.
# Prep first: bash scripts/datasets/prep_tiny_imagenet.sh
# Run: python src/train.py experiment=img/tinyimagenet_bregman_linbreg

defaults:
  - /experiment/img/cifar10_bregman_linbreg
  - override /datamodule: datasets/tinyimagenet.yaml
  - _self_

tags: ["img", "tinyimagenet", "Bregman_learning", "Linbreg"]

trainer:
  max_epochs: 100
