# @package _global_

# ProxSGD: minimize loss + lambda*||theta||_1 (penalty method, dense start).
# Inherits the AdaBreg parent; swaps the optimizer and starts dense.
# Run: python src/train.py experiment=img/proxsgd datamodule=datasets/cifar100

defaults:
  - /experiment/img/bregman_adabreg
  - _self_

tags: ["img", "${datamodule.name}", "Bregman_learning", "ProxSGD"]

_bregman_initial_sparsity: 0.0 # ProxSGD grows sparsity from a dense start
_bregman_lambda: ${bregman_lambda:ProxSGD,${_bregman_target_sparsity},initial_lambda}

module:
  optimizer:
    _target_: src.callbacks.pruning.bregman.bregman_optimizers.ProxSGD
    _partial_: True
    lr: 0.1
    momentum: 0.9
    nesterov: false
