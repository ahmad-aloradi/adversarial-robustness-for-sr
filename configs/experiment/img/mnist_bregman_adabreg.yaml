# @package _global_

# MNIST — adaptive AdaBreg pruning of ResNet-18.
# Inherits cifar10_bregman_adabreg; swaps only the dataset + epoch budget.
# Run: python src/train.py experiment=img/mnist_bregman_adabreg

defaults:
  - /experiment/img/cifar10_bregman_adabreg
  - override /datamodule: datasets/mnist.yaml
  - _self_

tags: ["img", "mnist", "Bregman_learning", "Adabreg"]

trainer:
  max_epochs: 50
