# @package _global_

# TinyImageNet — global unstructured gradual magnitude pruning of ResNet-18.
# Inherits cifar10_pruning_mag_unstruct; swaps only the dataset + epoch budget.
# Prep first: bash scripts/datasets/prep_tiny_imagenet.sh
# Run: python src/train.py experiment=img/tinyimagenet_pruning_mag_unstruct

defaults:
  - /experiment/img/cifar10_pruning_mag_unstruct
  - override /datamodule: datasets/tinyimagenet.yaml
  - _self_

tags: ["img", "tinyimagenet", "pruning", "l1_unstructured", "gradual"]

trainer:
  max_epochs: 100
