# @package _global_

# Structured (ln_structured) gradual magnitude pruning of ResNet-18.
# Canonical magnitude-pruning parent: the unstructured variant inherits this.
# Dataset-agnostic — the epoch budget comes from the dataset config. Equivalent
# recipe to configs/experiment/sv/sv_pruning_mag_struct.yaml.
# Run: python src/train.py experiment=img/pruning_mag_struct datamodule=datasets/cifar100
# (defaults to CIFAR-10 when no datamodule override is given)

defaults:
  - override /datamodule: datasets/cifar10.yaml
  - override /module: img.yaml
  - override /trainer: gpu.yaml
  - override /callbacks:
      - default.yaml
      - checkpoint_handler.yaml
  - override /logger: many_loggers.yaml
  - _self_

tags: ["img", "${datamodule.name}", "pruning", "ln_structured", "gradual"]
seed: 42

_pruning_tolerance: 0.005 # convergence band shared by the gates: in-band iff (1-this)*target <= sparsity <= (1+this)*target
_lr_constant_epochs: ${callbacks.model_pruning.epochs_to_ramp} # hold lr flat while sparsity ramps, cosine over what is left

trainer:
  max_epochs: ${datamodule.max_epochs} # per-dataset budget from the dataset config
  min_epochs: ${oc.eval:'int(${trainer.max_epochs} * 0.8)'}
  gradient_clip_val: null
  num_sanity_val_steps: 0
  # AdaptiveAvgPool2d has no deterministic CUDA backward.
  deterministic: warn

callbacks:
  model_checkpoint:
    _target_: src.callbacks.pruning.sparsity_gating.SparsityGatedModelCheckpoint
    target_sparsity: ${callbacks.model_pruning.amount} # band centre = pruning rate; top-k saved only within tolerance of this
    tolerance: ${_pruning_tolerance} # in-band half-width, as a fraction of the target
    sparsity_metric: "pruning/sparsity" # gate signal: all weight tensors, norms and biases aside; `sparsity` would be overall whole-model
    mode: max
    monitor: ${replace:"valid/__metric__"}
    save_top_k: 1 # never >1: eval averages the top-k, and averaging masks refills pruned weights
    every_n_epochs: 1
  model_pruning:
    _target_: src.callbacks.pruning.prune.MagnitudePruner
    pruning_fn: ln_structured # torch.nn.utils.prune function: ln_structured, l1_unstructured, random_structured, random_unstructured
    amount: 0.9 # final sparsity once scheduled_pruning finishes ramping
    initial_amount: 0.5 # ramp start; GraNet Table 4's s_i, shared by the ramped recipes
    use_global_unstructured: false # per-layer structured pruning, not a single global ranking
    prune_first_layer: true # GMP sparsifies every conv and fc layer (Gale et al. 2019)
    make_pruning_permanent: true # fuse masks into weights at training end
    pruning_dim: 1 # dimension pruned by ln_structured
    pruning_norm: 1 # Ln norm used to rank structures (L1)
    verbose: 1
    scheduled_pruning: true # ramp sparsity to `amount` over `epochs_to_ramp`
    epochs_to_ramp: ${oc.eval:'int(${trainer.max_epochs} * 0.75)'} # 75% of the budget
    schedule_type: cubic # Zhu & Gupta / GraNet Eq. 1 cubic ramp, not a linear sparsity ramp
    tolerance: ${_pruning_tolerance} # monotonicity check band, shared with the gates
  early_stopping:
    _target_: src.callbacks.pruning.sparsity_gating.SparsityGatedEarlyStopping
    target_sparsity: ${callbacks.model_pruning.amount} # patience advances only while in-band around this
    tolerance: ${_pruning_tolerance} # shared band half-width, as a fraction of the target
    sparsity_metric: "pruning/sparsity" # gate signal (see model_checkpoint)
    check_on_train_epoch_end: false # check at validation end, so suppressed epochs never accrue patience
    mode: max
    monitor: ${replace:"valid/__metric__"}
    patience: ${oc.eval:'int(${trainer.max_epochs} * 0.5)'}
  ramp_validation_gate:
    _target_: src.callbacks.pruning.sparsity_gating.RampValidationGate
    target_sparsity: ${callbacks.model_pruning.amount} # band centre
    tolerance: ${oc.eval:"${_pruning_tolerance} if '${datamodule.name}' == 'imagenet' else 1.0"} # 1.0 disables the gate; ImageNet keeps the band (docs/pruning.md §3)
    sparsity_metric: "pruning/sparsity" # gate signal (see model_checkpoint)

module:
  optimizer:
    _target_: torch.optim.SGD
    _partial_: True
    lr: 0.1
    momentum: 0.9
    weight_decay: 5e-4
    nesterov: false
  lr_scheduler:
    scheduler:
      _target_: src.utils.lr_schedulers.constant_then_cosine
      constant_epochs: ${_lr_constant_epochs}
      max_epochs: ${trainer.max_epochs}
    extras:
      interval: epoch
      frequency: ${trainer.check_val_every_n_epoch}
