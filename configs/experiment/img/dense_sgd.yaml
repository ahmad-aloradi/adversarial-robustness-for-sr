# @package _global_

# Dense SGD baseline (standard literature recipe, ResNet-18 backbone).
# One recipe for every dataset: the epoch budget and loaders come from the
# dataset config, the backbone never changes.
# Run: python src/train.py experiment=img/dense_sgd datamodule=datasets/mnist
# (defaults to CIFAR-10 when no datamodule override is given)

defaults:
  - override /datamodule: datasets/cifar10.yaml
  - override /module: img.yaml
  - override /trainer: gpu.yaml
  - override /callbacks: default.yaml
  - override /logger: many_loggers.yaml
  - _self_

tags: ["img", "${datamodule.name}", "dense", "sgd"]
seed: 42

trainer:
  max_epochs: ${datamodule.max_epochs} # per-dataset budget from the dataset config
  min_epochs: 1
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  # AdaptiveAvgPool2d has no deterministic CUDA backward; trainer/default sets
  # deterministic: True, which would raise on GPU.
  deterministic: warn

module:
  optimizer:
    _target_: torch.optim.SGD
    _partial_: True
    lr: 0.1
    momentum: 0.9
    weight_decay: 5e-4
    nesterov: True
  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.CosineAnnealingLR
      T_max: ${trainer.max_epochs}
    extras:
      interval: epoch
      frequency: ${trainer.check_val_every_n_epoch}

callbacks:
  model_checkpoint:
    monitor: ${replace:"valid/__metric__"}
    mode: max
    save_top_k: 5
    every_n_epochs: 1
