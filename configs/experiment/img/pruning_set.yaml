# @package _global_

# SET (Mocanu et al., Nature Comms 2018) growth criterion under RigL's schedule.
# Inherits the RigL parent and changes only how dropped weights are replaced,
# so the two runs isolate "does gradient-guided regrowth matter". This is the
# controlled ablation, not SET's published recipe (alpha 0.5, per-epoch updates,
# random init) — see docs/sparse_training.md.
# Run: python src/train.py experiment=img/pruning_set datamodule=datasets/mnist

defaults:
  - /experiment/img/pruning_rigl
  - _self_

tags: ["img", "${datamodule.name}", "sparse_training", "set"]

callbacks:
  model_pruning:
    growth: random # regrow uniformly at random among the inactive weights
