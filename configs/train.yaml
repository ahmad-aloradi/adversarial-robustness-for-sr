# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - datamodule: datasets/cnceleb.yaml
  - module: sv.yaml
  - callbacks: default.yaml
  - logger: tensorboard
  - trainer: default.yaml
  - paths: default.yaml
  - extras: default.yaml
  - hydra: default.yaml
  - quantization: none

  # experiment configs allow for version control of specific hyperparameters
  # e.g. the best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default.yaml

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

# task name, determines output directory path
task_name: "train"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
# appending lists from command line is currently not supported :(
# https://github.com/facebookresearch/hydra/issues/1547
tags: ["dev"]

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: True
save_state_dict: True

# simply provide checkpoint path to resume training
ckpt_path: null

# path to a previous training run directory; if set, overrides are loaded from
# {expdir}/.hydra/overrides.yaml and ckpt_path is set to last.ckpt automatically
expdir: null

# seed for random number generators in pytorch, numpy and python.random
seed: 42

# job start timestamp, kept for reference; never put it in the run dir (breaks viz discovery)
run_stamp: ${now:%Y-%m-%d_%H-%M-%S}

# output dir stem (hydra run/sweep dir = name/seed_N); the wandb run name is derived from that dir
# format: <dataset>/<model>/<augmentation>/<method>-isr<NN>-sr<NN>-<scheduler> so methods compare side by side
# sparsity source: Bregman `_bregman_target_sparsity`, else pruning `model_pruning.amount`, else none
# isr<NN> is the Bregman starting sparsity `_bregman_initial_sparsity`; dropped where that key is absent
# *_fixed experiments swap sr<NN> for lam<value>: their sparsity is whatever the static `_bregman_lambda` reaches
name: ${run_subdir:${oc.select:datamodule.name,null},${hydra:runtime.choices.module/img_model},${oc.select:datamodule.augmentation,null},${hydra:runtime.choices.experiment},${oc.select:_bregman_target_sparsity,${oc.select:callbacks.model_pruning.amount,null}},${oc.select:_bregman_initial_sparsity,null},${oc.select:_bregman_lambda,null},${oc.select:module.lr_scheduler.scheduler._target_,null}}

# default trainer overrides
trainer:
  check_val_every_n_epoch: 1
