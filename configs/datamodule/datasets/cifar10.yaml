_target_: src.datamodules.vision_datamodule.VisionDataModule

dataset:
  train_dataset:
    _target_: torchvision.datasets.CIFAR10
    root: ${paths.data_dir}/cifar10
    train: True
    download: True
  valid_dataset:
    split: 0.1
    split_seed: ${seed} # stratified-carve RNG; ties the split to the run seed
  test_dataset:
    _target_: torchvision.datasets.CIFAR10
    root: ${paths.data_dir}/cifar10
    train: False
    download: True

augmentation: true # gates transforms.augment (spatial, train-only)
transforms:
  base: # ToTensor + Normalize; the core shared by train and eval
    - { _target_: torchvision.transforms.ToTensor }
    - _target_: torchvision.transforms.Normalize
      mean: [0.4914, 0.4822, 0.4465]
      std: [0.2023, 0.1994, 0.2010]
  augment: # PIL-space, before ToTensor; gated by augmentation
    - { _target_: torchvision.transforms.RandomCrop, size: 32, padding: 4 }
    - { _target_: torchvision.transforms.RandomHorizontalFlip }
  augment_post: [] # tensor-space, after Normalize; gated by augmentation
  eval:
    - { _target_: torchvision.transforms.ToTensor }
    - _target_: torchvision.transforms.Normalize
      mean: [0.4914, 0.4822, 0.4465]
      std: [0.2023, 0.1994, 0.2010]

name: cifar10 # dataset tag for logging
num_classes: 10
max_epochs: 200 # standard literature budget; experiments read this via ${datamodule.max_epochs}
lr_milestones: [60, 120, 160] # epochs the lr drops on; experiments read this via ${datamodule.lr_milestones}

loaders:
  train:
    batch_size: 128
    shuffle: True
    num_workers: 8
    drop_last: False
    pin_memory: True
  valid:
    batch_size: 128
    shuffle: False
    num_workers: 8
    drop_last: False
    pin_memory: True
  test: ${.valid}
