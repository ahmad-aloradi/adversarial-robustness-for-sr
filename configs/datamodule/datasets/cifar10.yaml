_target_: src.datamodules.vision_datamodule.VisionDataModule

dataset:
  train_dataset:
    _target_: torchvision.datasets.CIFAR10
    root: ${paths.data_dir}/cifar10
    train: True
    download: True
  valid_dataset:
    _target_: torchvision.datasets.CIFAR10
    root: ${paths.data_dir}/cifar10
    train: False
    download: True
  # Validation == official test set (standard CIFAR/MNIST practice).
  test_dataset: ${.valid_dataset}

transforms:
  train:
    - { _target_: torchvision.transforms.RandomCrop, size: 32, padding: 4 }
    - { _target_: torchvision.transforms.RandomHorizontalFlip }
    - { _target_: torchvision.transforms.ToTensor }
    - _target_: torchvision.transforms.Normalize
      mean: [0.4914, 0.4822, 0.4465]
      std: [0.2470, 0.2435, 0.2616]
  eval:
    - { _target_: torchvision.transforms.ToTensor }
    - _target_: torchvision.transforms.Normalize
      mean: [0.4914, 0.4822, 0.4465]
      std: [0.2470, 0.2435, 0.2616]

num_classes: 10
in_channels: 3

loaders:
  train:
    batch_size: 128
    shuffle: True
    num_workers: 8
    drop_last: False
    pin_memory: True
  valid:
    batch_size: 256
    shuffle: False
    num_workers: 8
    drop_last: False
    pin_memory: True
  test: ${.valid}
