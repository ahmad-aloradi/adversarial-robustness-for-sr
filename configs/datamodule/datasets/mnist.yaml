_target_: src.datamodules.vision_datamodule.VisionDataModule

dataset:
  train_dataset:
    _target_: torchvision.datasets.MNIST
    root: ${paths.data_dir}/mnist
    train: True
    download: True
  valid_dataset:
    _target_: torchvision.datasets.MNIST
    root: ${paths.data_dir}/mnist
    train: False
    download: True
  test_dataset: ${.valid_dataset}

# MNIST recipe uses no train augmentation, so train == eval transforms.
transforms:
  train:
    - { _target_: torchvision.transforms.ToTensor }
    - _target_: torchvision.transforms.Normalize
      mean: [0.1307]
      std: [0.3081]
  eval:
    - { _target_: torchvision.transforms.ToTensor }
    - _target_: torchvision.transforms.Normalize
      mean: [0.1307]
      std: [0.3081]

num_classes: 10
in_channels: 1

loaders:
  train:
    batch_size: 128
    shuffle: True
    num_workers: 8
    drop_last: False
    pin_memory: True
  valid:
    batch_size: 256
    shuffle: False
    num_workers: 8
    drop_last: False
    pin_memory: True
  test: ${.valid}
