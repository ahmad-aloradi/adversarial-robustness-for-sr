_target_: src.datamodules.vision_datamodule.VisionDataModule

dataset:
  train_dataset:
    _target_: torchvision.datasets.CIFAR100
    root: ${paths.data_dir}/cifar100
    train: True
    download: True
  valid_dataset:
    split: 0.1
    split_seed: ${seed} # stratified-carve RNG; ties the split to the run seed
  test_dataset:
    _target_: torchvision.datasets.CIFAR100
    root: ${paths.data_dir}/cifar100
    train: False
    download: True

augmentation: true # gates transforms.augment (spatial, train-only)
transforms:
  normalize: # one source for train and eval; both lists end on this node
    _target_: torchvision.transforms.Normalize
    mean: [0.5071, 0.4865, 0.4409]
    std: [0.2673, 0.2564, 0.2762]
  base: # ToTensor + Normalize; the core shared by train and eval
    - { _target_: torchvision.transforms.ToTensor }
    - ${..normalize}
  augment: # PIL-space, before ToTensor; gated by augmentation — matches GraNet's get_cifar100_dataloaders
    - { _target_: torchvision.transforms.RandomCrop, size: 32, padding: 4 }
    - { _target_: torchvision.transforms.RandomHorizontalFlip }
  augment_post: [] # tensor-space, after Normalize; gated by augmentation
  eval:
    - { _target_: torchvision.transforms.ToTensor }
    - ${..normalize}

name: cifar100 # dataset tag for logging
num_classes: 100
max_epochs: 200 # standard literature budget; experiments read this via ${datamodule.max_epochs}

loaders:
  train:
    batch_size: 128
    shuffle: True
    num_workers: 8
    drop_last: False
    pin_memory: True
  valid:
    batch_size: 128
    shuffle: False
    num_workers: 8
    drop_last: False
    pin_memory: True
  test: ${.valid}
