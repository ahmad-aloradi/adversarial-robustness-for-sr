# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: custom  # Changed from colorlog to custom

# output directory = <name>/seed_<seed>; name is built in train.yaml via run_subdir
run:
  dir: ${paths.log_dir}/${task_name}/runs/${name}/seed_${seed}
sweep:
  dir: ${paths.log_dir}/${task_name}/multiruns/${name}/seed_${seed}
  subdir: ${hydra.job.num}
