_target_: src.modules.img.ImageClassification

defaults:
  - img_model: resnet18
  - _self_

### criteria and metrics ###
criterion:
  train_criterion:
    _target_: torch.nn.CrossEntropyLoss
  # For the `replace` resolver (__loss__). Non-`_partial_` so it resolves to
  # the class name, not "partial".
  loss: ${module.criterion.train_criterion}

# `train`/`valid`/`test` are top-1 (the monitored headline metric via
# `__metric__`); the `*_top5` siblings are logged alongside them.
metrics:
  train:
    _target_: torchmetrics.Accuracy
    task: multiclass
    num_classes: ${datamodule.num_classes}
  train_top5:
    _target_: torchmetrics.Accuracy
    task: multiclass
    num_classes: ${datamodule.num_classes}
    top_k: 5
  valid:
    _target_: torchmetrics.Accuracy
    task: multiclass
    num_classes: ${datamodule.num_classes}
  valid_top5:
    _target_: torchmetrics.Accuracy
    task: multiclass
    num_classes: ${datamodule.num_classes}
    top_k: 5
  valid_best:
    _target_: torchmetrics.MaxMetric
  test:
    _target_: torchmetrics.Accuracy
    task: multiclass
    num_classes: ${datamodule.num_classes}
  test_top5:
    _target_: torchmetrics.Accuracy
    task: multiclass
    num_classes: ${datamodule.num_classes}
    top_k: 5

### optimizer and lr_scheduler (set per experiment; `???` blocks stale kwargs
### from leaking across scheduler swaps, e.g. cosine T_max -> ReduceLROnPlateau)
optimizer: ???
lr_scheduler: ???

### extras and callbacks ###
logging_params:
  on_step: False
  on_epoch: True
  sync_dist: True
  prog_bar: True
